filter:
  excluded_paths:
    - 'tests/*'
checks:
  php: true
build:
  environment:
    php:
      version: 8.3
  tests:
    override:
      -
        command: XDEBUG_MODE=coverage vendor/bin/phpunit --coverage-clover=clover.xml
        coverage:
          file: clover.xml
          format: php-clover